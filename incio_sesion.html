<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIAR SESION Y REG</title>
    <link rel="stylesheet" href="for1_style.css">
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <div class="card-switch">
                <label class="switch">
                   <input type="checkbox" class="toggle">
                   <span class="slider"></span>
                   <span class="card-side"></span>
                   <div class="flip-card__inner">
                      <div class="flip-card__front">
                         <div class="title">INCIAR SESIÓN</div>
                         <form class="flip-card__form" action="alta.php" method="post">
                            <input class="flip-card__input" name="email" placeholder="Correo Electrónico" type="email">
                            <input class="flip-card__input" name="password" placeholder="Contraseña" type="password">
                            <input type="submit" class="flip-card__btn" value="INICIAR SESION">
                         </form>
                      </div>
                      <div class="flip-card__back">
                         <div class="title">REGÍSTRATE</div>
                         <form class="flip-card__form" action="">
                            <input class="flip-card__input" placeholder="Nombre" type="name" name="nomb">
                            <input class="flip-card__input" name="email" placeholder="Correo Electrónico" type="email">
                            <input class="flip-card__input" name="password" placeholder="Contraseña" type="password">
                            <button class="flip-card__btn">CONFIRMAR</button>
                         </form>
                      </div>
                   </div>
                </label>
            </div>   
       </div>
    </div>            
</body>

</html>
